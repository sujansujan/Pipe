name: Build Pipe APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bootstrap Gradle wrapper if not committed
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Ensure release keystore exists
        run: |
          if [ ! -f app/release-keystore.jks ]; then
            keytool -genkeypair -v               -keystore app/release-keystore.jks               -keyalg RSA -keysize 2048 -validity 10000               -alias pipe_release               -storepass pipe123456 -keypass pipe123456               -dname "CN=Sujan Devkota, OU=Pipe, O=Sujan, L=Kathmandu, S=Bagmati, C=NP"
          fi

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Assemble Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pipe-release-apk
          path: app/build/outputs/apk/release/*.apk
